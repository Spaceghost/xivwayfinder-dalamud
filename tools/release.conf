# What tools/release.sh and tools/releasekit.py need to know about this repository.
# KEY=value, one per line; lists are space separated (CI_WORKFLOWS: comma separated).
NAME=Wayfinder
INTERNAL_NAME=Wayfinder
REPO=Spaceghost/wayfinder-dalamud
MANIFEST=src/Wayfinder.Plugin/Wayfinder.json
# files that carry the four-part version (X.Y.Z.N)
VERSION_FILES=src/Wayfinder.Plugin/Wayfinder.json src/Wayfinder.Plugin/Wayfinder.Plugin.csproj
CHANGELOG_TOOL=tools/changelog.py
CHANGELOG_FILES=changelog.json CHANGELOG.md
BANNER=images/banner.png
SITE=https://spacegho.st/mods/ffxiv/wayfinder/
# workflows that must be green on the commit being released
CI_WORKFLOWS=CI
# run after the version is written, before anything is committed
CHECK=tools/check-manifest.py
